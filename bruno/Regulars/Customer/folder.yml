info:
  name: Customer
  type: folder

request:
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: http://localhost:5173
    - name: Referer
      value: http://localhost:5173
    - name: Content-Type
      value: application/json
    - name: X-XSRF-TOKEN
      value: 
  scripts:
    - type: after-response
      code: |-
        const setCookie = res.getHeader("set-cookie") || [];
        const raw = [].concat(setCookie).find(c => c.startsWith("XSRF-TOKEN="));
        if (raw) {
          const value = decodeURIComponent(raw.split(";")[0].replace("XSRF-TOKEN=", ""));
          bru.setVar("xsrf", value);
        }
