info:
  name: 02 Login
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/login/customer
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
    - name: Origin
      value: http://localhost:5173
    - name: Referer
      value: http://localhost:5173
    - name: X-XSRF-TOKEN
      value: 
  body:
    type: json
    data: |-
      {
        "email": "customer@example.com",
        "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
