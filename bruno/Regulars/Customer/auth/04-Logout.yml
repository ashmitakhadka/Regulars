info:
  name: 04 Logout
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:8000/api/logout/customer
  headers:
    - name: Accept
      value: application/json
    - name: Origin
      value: http://localhost:5173
    - name: Referer
      value: http://localhost:5173
    - name: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

