info:
  name: 04 Update Profile Same Phone
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:8000/api/customer/profile
  body:
    type: json
    data: |-
      {
        "name": "Aayush Sharma Updated",
        "phone": "9812345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
