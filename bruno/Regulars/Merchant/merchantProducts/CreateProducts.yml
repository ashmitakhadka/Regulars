info:
  name: CreateProducts
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/merchant/products
  body:
    type: json
    data: |-
      {
          "name": "Pastry",
          "description": "Fresh pastry",
          "price": 180
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
