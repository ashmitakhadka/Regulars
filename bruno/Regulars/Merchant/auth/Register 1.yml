  url: http://127.0.0.1:8000/api/register/merchant
  body:
    type: json
    data: |-
      {
          "name": "Test Owner",
          "email": "testowner@example.com",
          "password": "Password123",
          "password_confirmation": "Password123",
          "business_name": "Coffee Corner",
          "phone": "9800000000",
